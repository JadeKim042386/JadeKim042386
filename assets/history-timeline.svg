</text><rect x="235" y="344" width="895" height="92" rx="12" class="card"/><text x="265" y="382" class="title">3D modeling · air-quality control systems</text><text x="265" y="412" class="meta">2019.07–2019.11 · desulfurization and denitrification</text></g><g><title>2019–2020 — 3D modeling for a thermoelectric power plant</title><circle cx="160" cy="500" r="12" class="dot"/><text x="44" y="507" class="year">2019–20</text><rect x="235" y="454" width="895" height="92" rx="12" class="card"/><text x="265" y="492" class="title">3D modeling · thermoelectric power plant</text><text x="265" y="522" class="meta">2019.11–2020.07</text></g><g><title>2021 — Skid design, Kurita Y7 project</title><circle cx="160" cy="610" r="12" class="dot"/><text x="72" y="617" class="year">2021</text><rect x="235" y="564" width="895" height="92" rx="12" class="card"/><text x="265" y="602" class="title">Skid design · Kurita Y7 project</text><text x="265" y="632" class="meta">2021.01–2021.05</text></g><g><title>2021 — Computer vision track, Boostcamp AI Tech</title><circle cx="160" cy="720" r="12" class="dot"/><text x="72" y="727" class="year">2021</text><rect x="235" y="674" width="895" height="92" rx="12" class="card"/><text x="265" y="712" class="title">Computer vision track · Boostcamp AI Tech</text><text x="265" y="742" class="meta">2021.08–2021.12</text></g><g><title>2022–2023 — OCR research and development at zezedu</title><circle cx="160" cy="830" r="12" class="dot"/><text x="44" y="837" class="year">2022–23</text><rect x="235" y="784" width="895" height="92" rx="12" class="card"/><text x="265" y="822" class="title">OCR research and development · zezedu</text><text x="265" y="852" class="meta">2022.03–2023.03</text></g><text x="60" y="905" class="sub">Roles are shown as separate milestones, including distinct work and study periods in 2021.</text></svg>